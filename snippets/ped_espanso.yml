  - trigger: ";puericultura-rec"
    replace: |
      RECEITUÁRIO MÉDICO DE PUERICULTURA — SUPLEMENTAÇÃO PROFILÁTICA (SBP)
      Criança: [Nome] | Peso Atual: [ ] kg | Idade: [ ] meses | Data: [DD/MM/AAAA]
      
      USO ORAL DIÁRIO:
      1. Colecalciferol (Vitamina D3) Gotas (200 UI por gota) ------------------------ 1 frasco
         Dar [2 gotas (= 400 UI/dia para menores de 1 ano) / 3 gotas (= 600 UI/dia de 1 a 2 anos)] por via oral, 1 vez ao dia, todos os dias, até completar 24 meses de idade.
      
      2. Sulfato Ferroso (ou Ferro Polimaltosado / Quelato) Solução Gotas ------------ 1 frasco
         (Concentração padrão: 25 mg de Ferro Elementar/mL ≈ 1 mg de Ferro Elementar por gota)
         Dar [ ] gotas (Dose: [1 mg/kg/dia para nascidos a termo a partir dos 6 meses / 2 mg/kg/dia para prematuros ou baixo peso < 2.500 g a partir de 30 dias de vida]) por via oral, 1 vez ao dia, 30 minutos antes do almoço (preferencialmente junto com fruta cítrica rica em vitamina C, longe do leite), até os 24 meses.
      
      3. Soro Fisiológico 0,9% ------------------------------------------------------- 1 frasco
         Para higiene nasal com seringa de 3 a 5 mL em cada narina antes das mamadas e antes de dormir se houver congestão nasal.
      
      ORIENTAÇÕES NUTRICIONAIS E DE SEGURANÇA (SBP / MINISTÉRIO DA SAÚDE):
      - Zero açúcar, zero mel (risco de botulismo intestinal em < 1 ano), zero sucos (mesmo naturais) no 1º ano de vida e zero alimentos ultraprocessados (biscoitos, iogurtes açucarados, embutidos) nos primeiros 2 anos.
      - Posição de Sono Seguro: Sempre de barriga para cima (decúbito dorsal), em colchão firme, sem travesseiros fofos, protetores de berço ou cobertores soltos.
      - Zero exposição a telas (celular, tablet, televisão) antes dos 2 anos de idade.

  - trigger: ";ped-resfriado"
    replace: |
      ###### ATENDIMENTO PEDIÁTRICO — RESFRIADO COMUM / RINOFARINGITE AGUDA ######
      # IDENTIFICAÇÃO & PESO:
      - Paciente: [Nome] | Idade: [ ] [meses / anos] | Sexo: [Masculino / Feminino] | **PESO ATUAL: [ ] kg**
      - Acompanhante: [Mãe / Pai / Responsável:]
      
      # SUBJETIVO (ANAMNESE DIRIGIDA & EXCLUSÃO DE GRAVIDADE):
      - Queixa Principal (QP): Coriza, obstrução nasal e tosse há [ ] dias.
      - História da Moléstia Atual (HMA): Quadro iniciado há [ ] dias com espirros, obstrução nasal e rinorreia [hialina fluida / mucoide amarelada fisiológica da evolução viral], acompanhada de tosse [predominantemente noturna ao deitar por gotejamento pós-nasal].
      - Curva Térmica: [Afebril / Febre baixa a moderada (< 38,5 °C) nos primeiros 2–3 dias, cedendo rapidamente ao antitérmico].
      - Estado Geral, Aceitação e Diurese: Criança permanece ativa, brincando e sorrindo quando afebril; aceitando [bem líquidos e seio materno / com leve redução de sólidos pelo nariz entupido]. Diurese clara e preservada.
      - Negativas Mandatórias de Complicações Bacterianas e Gravidade:
        * Nega dispneia, respiração acelerada (taquipneia), afundamento de costelas (tiragens) ou gemência.
        * Nega sibilância (chiado no peito) ou estridor laríngeo inspiratório.
        * Nega febre alta persistente (> 39 °C) por mais de 72 horas ou "dupla curva" (piora após o 5º dia).
        * Nega otalgia intensa, otorreia purulenta ou abaulamento retroauricular.
        * Nega prostração fora do período febril, vômitos incoercíveis ou petéquias.
      
      # OBJETIVO (EXAME FÍSICO PEDIÁTRICO):
      - Sinais Vitais: FC: [ ] bpm | FR (em 1 min, sem febre): [ ] irpm (Eupneico para a faixa etária) | SpO2: [ ]% em AA | Tax: [ ] °C | TEC < 2s.
      - Ectoscopia: Bom estado geral (BEG), ativo e reativo no colo, corado, hidratado, anictérico, acianótico, sem esforço respiratório.
      - Aparelho Respiratório: Expansibilidade simétrica, ausência de tiragem subcostal, intercostal ou de fúrcula. Murmúrio vesicular universalmente audível, sem estertores crepitantes ou sibilos (apenas roncos de transmissão de vias aéreas superiores que desaparecem após tosse/lavagem nasal).
      - Rinoscopia & Oroscopia: Mucosa nasal hiperemiada e edemaciada com secreção [hialina / mucoide] sem corpo estranho; orofaringe com hiperemia difusa leve e gotejamento pós-nasal, amígdalas sem placas ou exsudato purulento.
      - Otoscopia Bilateral: Membranas timpânicas íntegras, translúcidas, sem abaulamento e com triângulo luminoso preservado bilateralmente (afastada Otite Média Aguda).
      - Cardiopulmonar e Abdome: Bulhas normofonéticas em 2T sem sopros; abdome flácido e indolor sem visceromegalias.
      
      # AVALIAÇÃO DIAGNÓSTICA:
      1. Rinofaringite Aguda Viral / Resfriado Comum (CID-10: J00) — evolução benigna e autolimitada, sem sinais de complicação bacteriana secundária (OMA, sinusite ou pneumonia).
      
      # PLANO / CONDUTA:
      
      >> CONDUTA AMBULATORIAL BASEADA EM EVIDÊNCIAS (SBP):
      1. Desobstrução mecânica das vias aéreas superiores com **Lavagem Nasal de Soro Fisiológico 0,9%** morno em seringa (pilar terapêutico principal).
      2. Analgesia e controle térmico sintomático (Dipirona ou Paracetamol gotas ajustados pelo peso) apenas se febre associada a desconforto ou dor.
      3. Hidratação oral abundante e fracionamento das mamadas/refeições.
      4. Proscrição formal e explicação aos pais sobre a proibição de antibióticos, xaropes antitussígenos/mucolíticos e descongestionantes nasais tópicos ou sistêmicos.
      5. Orientados sinais de alarme para retorno imediato (taquipneia, tiragem subcostal, febre > 72h, otalgia ou prostração sem febre).

