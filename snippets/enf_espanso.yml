      - Extremidades: [Ausência de edema / Edema de MMII ((+ / ++)/4+) simétrico com cacifo]. Panturrilhas livres, macias e indolores à palpação (Sinal de Homans negativo).
      - Pele & Dispositivos na Admissão:
